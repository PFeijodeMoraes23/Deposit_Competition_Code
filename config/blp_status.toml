# config/blp_status.toml — whether the random-coefficients (BLP) results are final.
#
# "pending-blp-ext1": the fits are provisional. make_paper_numbers.py marks every BLP-derived
# entry pending-blp-ext1 (the Table 6 rows, the BLP price coefficient, the elasticities and
# ratios, and the demand.xi.* diagnostics of the ext1 residual), so the paper prints them as a red
# ?? (their value in red with \PNshowpendingtrue). The random-coefficients tables
# (make_blp_rc_table.py, make_blp_demand_comparison_table.py, make_xi_diagnostics.py) add the
# `provisional` sentence of config/table_notes.toml to their notes.
# "ok": the adopted fits are final.
#
# Read by utils/blp_status.py. Set "ok" only when corrected fits are adopted, then rerun those
# three generators and make_paper_numbers.py. make_paper_numbers.py --blp-pending forces pending
# for one run whatever this file says.
status = "pending-blp-ext1"
since  = "2026-10-31"
reason = "the engine's diagonal-IFT gradient points uphill, so no random-coefficients fit is a minimum; re-estimation with the exact Jacobian"

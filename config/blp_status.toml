# config/blp_status.toml — whether the random-coefficients (BLP) results are final, per routine.
#
# "pending-blp-ext1": the fits are provisional. make_paper_numbers.py marks every BLP-derived
# entry of that routine pending-blp-ext1 (the Table 6 rows, the BLP price coefficient, the
# elasticities and ratios, and the demand.xi.* diagnostics of the ext1 residual), so the paper
# prints them as a red ?? (their value in red with \PNshowpendingtrue). The random-coefficients
# tables (make_blp_rc_table.py, make_blp_demand_comparison_table.py, make_xi_diagnostics.py) add the
# `provisional` sentence of config/table_notes.toml to their notes.
# "ok": the adopted fits are final.
#
# `status` is the default; [routines] gives each routine its own value (a routine not listed takes
# the default). A table or entry that spans routines is pending while any of them is.
#
# Read by utils/blp_status.py. Set a routine "ok" only when its corrected fits are adopted, then
# rerun those three generators and make_paper_numbers.py. make_paper_numbers.py --blp-pending
# forces pending for one run whatever this file says.
status = "ok"
since  = "2026-11-06"
reason = "I2 fa38794d: ext1 passes the FD check in all four routines; global optimum not proven (I10)"

[routines]
E3 = "ok"
E4 = "ok"
